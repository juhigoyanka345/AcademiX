<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unified Multi-Role Login | Student Performance XAI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md glass-panel p-8 rounded-2xl shadow-2xl border border-indigo-500/20 space-y-6">
        
        <div class="text-center space-y-2">
            <div class="mx-auto h-12 w-12 rounded-2xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center text-white text-2xl font-black shadow-lg shadow-indigo-500/40">
                <i class="fas fa-brain"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-white">Platform Portal Login</h1>
            <p class="text-xs text-slate-400">Sign in to access your role-specific dashboard panel</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="space-y-2">
            {% for category, message in messages %}
              <div class="p-3 rounded-xl text-xs font-medium border flex items-center space-x-2 {{ 'bg-emerald-950/70 border-emerald-500/40 text-emerald-300' if category == 'success' else 'bg-rose-950/70 border-rose-500/40 text-rose-300' }}">
                <i class="fas {{ 'fa-check-circle' if category == 'success' else 'fa-exclamation-circle' }}"></i>
                <span>{{ message }}</span>
              </div>
            {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <!-- Quick Demo Role Switcher Tabs -->
        <div class="grid grid-cols-3 gap-2 p-1 rounded-xl bg-slate-900 border border-slate-800 text-[11px] font-bold text-center">
            <button onclick="setCredentials('admin', 'admin123')" class="py-1.5 rounded-lg hover:bg-purple-500/20 text-purple-300 transition-colors">
                <i class="fas fa-crown block mb-0.5 text-xs"></i>Admin
            </button>
            <button onclick="setCredentials('prof_smith', 'faculty123')" class="py-1.5 rounded-lg hover:bg-indigo-500/20 text-indigo-300 transition-colors">
                <i class="fas fa-chalkboard-teacher block mb-0.5 text-xs"></i>Faculty
            </button>
            <button onclick="setCredentials('stu_alex', 'student123')" class="py-1.5 rounded-lg hover:bg-emerald-500/20 text-emerald-300 transition-colors">
                <i class="fas fa-user-graduate block mb-0.5 text-xs"></i>Student
            </button>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Username or Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                        <i class="fas fa-user"></i>
                    </span>
                    <input type="text" id="login-username" name="username" value="admin" required class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center text-slate-500">
                        <i class="fas fa-lock"></i>
                    </span>
                    <input type="password" id="login-password" name="password" value="admin123" required class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <button type="submit" class="w-full py-3 px-4 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-extrabold text-sm shadow-lg shadow-indigo-600/30 transition-all">
                Sign In to Platform &rarr;
            </button>
        </form>

        <div class="text-center pt-2 border-t border-slate-800">
            <p class="text-xs text-slate-400">
                New student? <a href="{{ url_for('register_student') }}" class="text-emerald-400 hover:text-emerald-300 font-bold">Register your Student Account &rarr;</a>
            </p>
        </div>

    </div>

    <script>
        function setCredentials(u, p) {
            document.getElementById('login-username').value = u;
            document.getElementById('login-password').value = p;
        }
    </script>

</body>
</html>
